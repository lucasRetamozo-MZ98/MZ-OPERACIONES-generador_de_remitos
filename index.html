<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/logo.ico" />
    <title>Generador de Remitos — MOTOZUNI S.A.</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-container">
    <!-- BARRA LATERAL: FORMULARIO -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-header-top">
                <div>
                    <h2>Motozuni S.A.</h2>
                    <p>Generador de Remitos de Equipamiento</p>
                </div>
                <button type="button" class="btn-header-admin" onclick="adminPanel.abrir('plantillas')" title="Gestionar plantillas, sucursales, sectores, componentes y base de datos">
                    ⚙️ Gestionar
                </button>
            </div>
            <div class="sidebar-db-row">
                <button type="button" id="db-status-pill" class="header-db-pill" onclick="adminPanel.abrir('database')" title="Ver o configurar conexión a base de datos Supabase">
                    ⏳ Cargando base de datos...
                </button>
            </div>
        </div>

        <div class="form-container">
            <div class="form-group">
                <div class="label-row">
                    <label for="tipo_remito">Tipo de Remito</label>
                    <span class="btn-gen-code" onclick="adminPanel.abrir('plantillas')" title="Crear o editar plantillas de remitos">✏️ Plantillas</span>
                </div>
                <select id="tipo_remito" onchange="onTipoRemitoChange()">
                    <!-- Se puebla dinámicamente desde la base de datos -->
                </select>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="sucursal">Sucursal</label>
                    <span class="btn-gen-code" onclick="adminPanel.abrir('sucursales')" title="Agregar o editar sucursales">✏️ Sucursales</span>
                </div>
                <select id="sucursal" onchange="onSucursalChange()">
                    <!-- Se puebla dinámicamente desde la base de datos -->
                </select>
            </div>

            <div id="dynamic-fields">
                <!-- Campos dinámicos según la plantilla seleccionada -->
            </div>

            <!-- Sección de Componentes Adicionales -->
            <div class="seccion-adicionales" id="seccion-adicionales-container">
                <div class="seccion-adicionales-header">
                    <label class="seccion-title">🧩 Componentes Adicionales</label>
                </div>
                <div id="componentes-adicionales-lista"></div>
                <button type="button" class="btn-add-comp btn-add-comp-bottom" onclick="agregarComponenteAdicional()" title="Agregar otro dispositivo o componente al remito">
                    + Agregar Componente
                </button>
            </div>

            <button class="btn-print" onclick="imprimirConNombreSugerido()">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"></path>
                    <path d="M6 14h12v8H6z"></path>
                </svg>
                Imprimir / Guardar PDF
            </button>
        </div>
    </div>

    <!-- VISTA PREVIA HOJA A4 -->
    <div class="preview-container">
        <div class="a4-page" id="document-preview">
            <!-- El contenido del remito se renderiza en tiempo real -->
        </div>
    </div>
</div>

<!-- MODAL DE GESTIÓN (PLANTILLAS, SUCURSALES, SECTORES, COMPONENTES, SUPABASE) -->
<div class="admin-modal" id="admin-modal" role="dialog" aria-modal="true" aria-label="Panel de Gestión">
    <div class="admin-modal-dialog">
        <div class="admin-modal-header">
            <div>
                <h2>⚙️ Panel de Gestión — Motozuni S.A.</h2>
                <p>Administrá plantillas de remitos, sucursales, sectores, tipos de componentes y conexión con Supabase</p>
            </div>
            <button type="button" class="admin-close-btn" onclick="adminPanel.cerrar()" title="Cerrar">✕</button>
        </div>

        <div class="admin-tabs">
            <button type="button" class="admin-tab-btn active" data-tab="plantillas" onclick="adminPanel.cambiarTab('plantillas')">📑 Plantillas</button>
            <button type="button" class="admin-tab-btn" data-tab="sucursales" onclick="adminPanel.cambiarTab('sucursales')">🏢 Sucursales</button>
            <button type="button" class="admin-tab-btn" data-tab="sectores" onclick="adminPanel.cambiarTab('sectores')">👥 Sectores / Áreas</button>
            <button type="button" class="admin-tab-btn" data-tab="componentes" onclick="adminPanel.cambiarTab('componentes')">🧩 Tipos de Componentes</button>
            <button type="button" class="admin-tab-btn" data-tab="database" onclick="adminPanel.cambiarTab('database')">☁️ Base de Datos</button>
        </div>

        <div class="admin-modal-body" id="admin-modal-body">
            <!-- Se renderiza dinámicamente desde admin.js -->
        </div>
    </div>
</div>

<div class="admin-toast" id="admin-toast"></div>

<script src="config.js"></script>
<script src="defaults.js"></script>
<script src="models.js"></script>
<script src="database.js"></script>
<script src="services.js"></script>
<script src="admin.js"></script>
<script src="script.js"></script>
</body>
</html>
